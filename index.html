<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PhysioCalc Pro - Physics Formulas & Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; touch-action: manipulation; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-cyan-500 selection:text-white">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-3 py-2.5 flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center space-x-2.5">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-cyan-500/30 shrink-0">
                <i class="fa-solid fa-atom text-white text-base"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm tracking-tight leading-tight" id="appTitle">PhysioCalc Pro</h1>
                <p class="text-[10px] text-slate-400 leading-tight" id="appSubtitle">Усі формули та калькулятор</p>
            </div>
        </div>
        <div class="flex items-center space-x-1.5 ml-auto">
            <!-- Кнопка окремого калькулятора -->
            <button onclick="openStandaloneCalc()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-cyan-400 px-2.5 py-1.5 rounded-xl text-[11px] font-bold transition flex items-center space-x-1 cursor-pointer">
                <i class="fa-solid fa-calculator"></i> <span id="calcBtnLabel">Калькулятор</span>
            </button>
            <!-- Кнопка додавання власної формули -->
            <button onclick="openAddModal()" class="bg-cyan-600 hover:bg-cyan-500 text-slate-950 px-2.5 py-1.5 rounded-xl text-[11px] font-bold transition flex items-center space-x-1 cursor-pointer">
                <i class="fa-solid fa-plus"></i> <span id="addBtnText">Додати</span>
            </button>
            <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-slate-800 border border-slate-700 text-[11px] rounded-xl px-2 py-1.5 text-slate-200 focus:outline-none focus:border-cyan-500 cursor-pointer">
                <option value="en">EN</option>
                <option value="uk" selected>UA</option>
                <option value="pl">PL</option>
                <option value="de">DE</option>
                <option value="es">ES</option>
                <option value="fr">FR</option>
                <option value="it">IT</option>
                <option value="tr">TR</option>
                <option value="ro">RO</option>
                <option value="pt">PT</option>
            </select>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl w-full mx-auto p-3 sm:p-4 flex-1 space-y-3">

        <!-- Smart Search Box -->
        <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-3.5 shadow-xl space-y-2.5">
            <h2 class="font-semibold text-xs text-cyan-400 flex items-center space-x-2">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span id="searchHeader">Розумний пошук формули</span>
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1" id="labelGiven">Що дано (напр: v, t, m):</label>
                    <input type="text" id="inputGiven" oninput="renderFormulas()" placeholder="v, t..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1" id="labelFind">Що треба знайти (напр: s, F, A):</label>
                    <input type="text" id="inputFind" oninput="renderFormulas()" placeholder="s..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-cyan-500">
                </div>
            </div>
        </div>

        <!-- Перемикач: Всі формули / Мої формули -->
        <div class="flex space-x-2">
            <button onclick="setTab('all')" id="tabAll" class="px-3.5 py-1.5 rounded-xl bg-cyan-600 text-white text-xs font-semibold whitespace-nowrap cursor-pointer transition">Усі формули</button>
            <button onclick="setTab('custom')" id="tabCustom" class="px-3.5 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-amber-400 text-xs font-semibold whitespace-nowrap cursor-pointer hover:border-slate-700 transition">✨ Мої формули</button>
        </div>

        <!-- Formula List -->
        <div id="formulasList" class="space-y-2.5"></div>

    </main>

    <!-- Modal for Formula Calculator -->
    <div id="calcModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-5 shadow-2xl relative space-y-3.5">
            <div class="flex items-center justify-between pb-2.5 border-b border-slate-800">
                <h3 id="modalFormulaTitle" class="font-bold text-sm text-cyan-400">Формула</h3>
                <button onclick="closeCalc()" class="w-7 h-7 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white transition cursor-pointer">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>
            <div id="modalFormulaEquation" class="text-lg font-mono text-center font-bold text-white bg-slate-950 py-2.5 rounded-2xl border border-slate-800"></div>
            <div id="modalInputs" class="space-y-2.5 max-h-[45vh] overflow-y-auto pr-1"></div>
            <div class="pt-1">
                <button onclick="calculateResult()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition cursor-pointer" id="calcBtnText">Обчислити</button>
            </div>
            <div id="modalResult" class="text-center font-bold text-cyan-300 text-base py-1"></div>
        </div>
    </div>

    <!-- Modal for Standalone Calculator -->
    <div id="standaloneCalcModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-xs w-full p-5 shadow-2xl relative space-y-3.5">
            <div class="flex items-center justify-between pb-2.5 border-b border-slate-800">
                <h3 class="font-bold text-sm text-cyan-400" id="standCalcTitle">Калькулятор</h3>
                <button onclick="closeStandaloneCalc()" class="w-7 h-7 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white transition cursor-pointer">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>
            <input type="text" id="calcScreen" readonly class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-3 py-2.5 text-right font-mono text-lg text-white focus:outline-none">
            <div class="grid grid-cols-4 gap-2">
                <button onclick="calcClear()" class="bg-rose-500/20 text-rose-400 py-2.5 rounded-xl font-bold text-xs hover:bg-rose-500/35 transition">C</button>
                <button onclick="calcAppend('(')" class="bg-slate-800 text-slate-300 py-2.5 rounded-xl font-bold text-xs">(</button>
                <button onclick="calcAppend(')')" class="bg-slate-800 text-slate-300 py-2.5 rounded-xl font-bold text-xs">)</button>
                <button onclick="calcAppend('/')" class="bg-cyan-500/20 text-cyan-400 py-2.5 rounded-xl font-bold text-xs">÷</button>

                <button onclick="calcAppend('7')" class="bg-slate-800 text-white py-2.5 rounded-xl font-bold text-xs">7</button>
                <button onclick="calcAppend('8')" class="bg-slate-800 text-white py-2.5 rounded-xl font-bold text-xs">8</button>
                <button onclick="calcAppend('9')" class="bg-slate-800 text-white py-2.5 rounded-xl font-bold text-xs">9</button>
                <button onclick="calcAppend('*')" class="bg-cyan-500/20 text-cyan-400 py-2.5 rounded-xl font-bold text-xs">×</button>

                <button onclick="calcAppend('4')" class="bg-slate-800 text-white py-2.5 rounded-xl font-bold text-xs">4</button>
                <button onclick="calcAppend('5')" class="bg-slate-800 text-white py-2.5 rounded-xl font-bold text-xs">5</button>
                <button onclick="calcAppend('6')" class="bg-slate-800 text-white py-2.5 rounded-xl font-bold text-xs">6</button>
                <button onclick="calcAppend('-')" class="bg-cyan-500/20 text-cyan-400 py-2.5 rounded-xl font-bold text-xs">-</button>

                <button onclick="calcAppend('1')" class="bg-slate-800 text-white py-2.5 rounded-xl font-bold text-xs">1</button>
                <button onclick="calcAppend('2')" class="bg-slate-800 text-white py-2.5 rounded-xl font-bold text-xs">2</button>
                <button onclick="calcAppend('3')" class="bg-slate-800 text-white py-2.5 rounded-xl font-bold text-xs">3</button>
                <button onclick="calcAppend('+')" class="bg-cyan-500/20 text-cyan-400 py-2.5 rounded-xl font-bold text-xs">+</button>

                <button onclick="calcAppend('0')" class="col-span-2 bg-slate-800 text-white py-2.5 rounded-xl font-bold text-xs">0</button>
                <button onclick="calcAppend('.')" class="bg-slate-800 text-white py-2.5 rounded-xl font-bold text-xs">.</button>
                <button onclick="calcEvaluate()" class="bg-cyan-600 text-slate-950 py-2.5 rounded-xl font-bold text-xs">=</button>
            </div>
        </div>
    </div>

    <!-- Modal for Adding Custom Formula -->
    <div id="addModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-5 shadow-2xl relative space-y-3 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-2.5 border-b border-slate-800">
                <h3 class="font-bold text-sm text-amber-400" id="addModalTitle">Додати власну формулу</h3>
                <button onclick="closeAddModal()" class="w-7 h-7 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white transition cursor-pointer">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>
            <div class="space-y-2.5">
                <div>
                    <label class="text-[11px] text-slate-400 block mb-1" id="labelName">Назва формули:</label>
                    <input type="text" id="newTitle" placeholder="Наприклад: Імпульс тіла" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="text-[11px] text-slate-400 block mb-1" id="labelFormula">Математичний вираз (формула):</label>
                    <input type="text" id="newFormula" placeholder="p = m * v" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs font-mono text-amber-400 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="text-[11px] text-slate-400 block mb-1" id="labelNewFind">Що шукаємо (основна літера):</label>
                    <input type="text" id="newFind" placeholder="p" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="text-[11px] text-slate-400 block mb-1" id="labelNewGiven">Що дано (через кому):</label>
                    <input type="text" id="newGiven" placeholder="m, v" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="text-[11px] text-slate-400 block mb-1" id="labelJsCalc">JavaScript формула розрахунку (напр: d.m * d.v):</label>
                    <input type="text" id="newCalc" placeholder="d.m * d.v" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs font-mono text-cyan-400 focus:outline-none focus:border-amber-500">
                </div>
            </div>
            <div class="pt-1">
                <button onclick="saveCustomFormula()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition cursor-pointer" id="saveBtnText">Зберегти формулу</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-3 text-center text-[11px] text-slate-500 border-t border-slate-900" id="footerText">
        PhysioCalc Pro &bull; Universal Edition
    </footer>

            { id: 6, formula: "F_пруж = k * x", given: ["k", "x"], find: "F_пруж", calc: (d) => d.k * d.x, symKeys: ["k", "x"] },
            { id: 7, formula: "F_тер = mu * N", given: ["mu", "N"], find: "F_тер", calc: (d) => d.mu * d.N, symKeys: ["mu", "N"] },
            { id: 8, formula: "P = m * g", given: ["m"], find: "P", calc: (d) => d.m * 9.8, symKeys: ["m"] },
            { id: 9, formula: "F_арх = rho * g * V_зан", given: ["rho", "V_зан"], find: "F_арх", calc: (d) => d.rho * 9.8 * d.V_зан, symKeys: ["rho", "V_зан"] },
            { id: 10, formula: "A = F * l", given: ["F", "l"], find: "A", calc: (d) => d.F * d.l, symKeys: ["F", "l"] },
            { id: 11, formula: "N = A / t", given: ["A", "t"], find: "N", calc: (d) => d.A / d.t, symKeys: ["A", "t"] },
            { id: 12, formula: "E_p = m * g * h", given: ["m", "h"], find: "E_p", calc: (d) => d.m * 9.8 * d.h, symKeys: ["m", "h"] },
            { id: 13, formula: "E_k = (m * v^2) / 2", given: ["m", "v"], find: "E_k", calc: (d) => (d.m * Math.pow(d.v, 2)) / 2, symKeys: ["m", "v"] },
            { id: 14, formula: "Q = c * m * delta_t", given: ["c", "m", "delta_t"], find: "Q", calc: (d) => d.c * d.m * d.delta_t, symKeys: ["c", "m", "delta_t"] },
            { id: 15, formula: "Q = lambda * m", given: ["lambda", "m"], find: "Q", calc: (d) => d.lambda * d.m, symKeys: ["lambda", "m"] },
            { id: 16, formula: "Q = r * m", given: ["r", "m"], find: "Q", calc: (d) => d.r * d.m, symKeys: ["r", "m"] },
            { id: 17, formula: "Q = q * m", given: ["q", "m"], find: "Q", calc: (d) => d.q * d.m, symKeys: ["q", "m"] },
            { id: 18, formula: "eta = (Q_кор / Q_повн) * 100", given: ["Q_кор", "Q_повн"], find: "eta", calc: (d) => (d.Q_кор / d.Q_повн) * 100, symKeys: ["Q_кор", "Q_повн"] },
            { id: 19, formula: "I = q / t", given: ["q", "t"], find: "I", calc: (d) => d.q / d.t, symKeys: ["q", "t"] },
            { id: 20, formula: "U = A / q", given: ["A", "q"], find: "U", calc: (d) => d.A / d.q, symKeys: ["A", "q"] },
            { id: 21, formula: "R = rho_res * (l / S)", given: ["rho_res", "l", "S"], find: "R", calc: (d) => d.rho_res * (d.l / d.S), symKeys: ["rho_res", "l", "S"] },
            { id: 22, formula: "I = U / R", given: ["U", "R"], find: "I", calc: (d) => d.U / d.R, symKeys: ["U", "R"] },
            { id: 23, formula: "F = k_c * (|q1| * |q2|) / r^2", given: ["k_c", "q1", "q2", "r"], find: "F", calc: (d) => 9e9 * (Math.abs(d.q1) * Math.abs(d.q2)) / Math.pow(d.r, 2), symKeys: ["k_c", "q1", "q2", "r"] },
            { id: 24, formula: "A = U * I * t", given: ["U", "I", "t"], find: "A", calc: (d) => d.U * d.I * d.t, symKeys: ["U", "I", "t"] },
            { id: 25, formula: "P = U * I", given: ["U", "I"], find: "P", calc: (d) => d.U * d.I, symKeys: ["U", "I"] },
            { id: 26, formula: "Q = I^2 * R * t", given: ["I", "R", "t"], find: "Q", calc: (d) => Math.pow(d.I, 2) * d.R * d.t, symKeys: ["I", "R", "t"] },
            { id: 27, formula: "F_амп = B * I * l * sin(alpha)", given: ["B", "I", "l", "alpha"], find: "F_амп", calc: (d) => d.B * d.I * d.l * Math.sin(d.alpha * Math.PI / 180), symKeys: ["B", "I", "l", "alpha"] }
        ];

        function getLocalizedFormulas() {
            const names = formulaNamesByLang[currentLang] || formulaNamesByLang['en'];
            const syms = symbolsMap[currentLang] || symbolsMap['en'];
            return defaultFormulasTemplates.map(t => {
                const localizedSymbols = {};
                t.symKeys.forEach(sk => {
                    localizedSymbols[sk] = syms[sk] || sk;
                });
                return {
                    id: t.id,
                    type: 'default',
                    name: names[t.id] || "Formula",
                    formula: t.formula,
                    given: t.given,
                    find: t.find,
                    calc: t.calc,
                    symbols: localizedSymbols
                };
            });
        }

        let customFormulas = JSON.parse(localStorage.getItem('custom_physics_formulas_data') || '[]');
        customFormulas = customFormulas.map(f => ({ ...f, calc: new Function('d', 'return ' + f.calcStr) }));
        let activeFormula = null;

        function changeLanguage(lang) {
            currentLang = lang;
            const t = i18n[lang];
            document.getElementById('appTitle').innerText = t.title;
            document.getElementById('appSubtitle').innerText = t.subtitle;
            document.getElementById('searchHeader').innerText = t.searchHeader;
            document.getElementById('labelGiven').innerText = t.labelGiven;
            document.getElementById('labelFind').innerText = t.labelFind;
            document.getElementById('tabAll').innerText = t.all;
            document.getElementById('tabCustom').innerText = t.custom;
            document.getElementById('addBtnText').innerText = t.addBtn;
            document.getElementById('calcBtnLabel').innerText = t.calcLabel;
            document.getElementById('standCalcTitle').innerText = t.standCalcTitle;
            document.getElementById('addModalTitle').innerText = t.addModalTitle;
            document.getElementById('labelName').innerText = t.labelName;
            document.getElementById('labelFormula').innerText = t.labelFormula;
            document.getElementById('labelNewFind').innerText = t.labelNewFind;
            document.getElementById('labelNewGiven').innerText = t.labelNewGiven;
            document.getElementById('labelJsCalc').innerText = t.labelJsCalc;
            document.getElementById('saveBtnText').innerText = t.saveBtnText;
            document.getElementById('footerText').innerHTML = t.footerText;
            renderFormulas();
        }

        function setTab(tab) {
            currentTab = tab;
            if (tab === 'all') {
                document.getElementById('tabAll').className = "px-3.5 py-1.5 rounded-xl bg-cyan-600 text-white text-xs font-semibold whitespace-nowrap cursor-pointer transition";
                document.getElementById('tabCustom').className = "px-3.5 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-amber-400 text-xs font-semibold whitespace-nowrap cursor-pointer hover:border-slate-700 transition";
            } else {
                document.getElementById('tabCustom').className = "px-3.5 py-1.5 rounded-xl bg-cyan-600 text-white text-xs font-semibold whitespace-nowrap cursor-pointer transition";
                document.getElementById('tabAll').className = "px-3.5 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 text-xs font-semibold whitespace-nowrap cursor-pointer hover:border-slate-700 transition";
            }
            renderFormulas();
        }

        function renderFormulas() {
            const container = document.getElementById('formulasList');
            container.innerHTML = '';
            
            const givenQuery = document.getElementById('inputGiven').value.toLowerCase().trim();
            const findQuery = document.getElementById('inputFind').value.toLowerCase().trim();

            let activeList = currentTab === 'all' ? getLocalizedFormulas() : customFormulas;
            const loc = i18n[currentLang];

            const filtered = activeList.filter(f => {
                const nameMatch = f.name.toLowerCase().includes(givenQuery) || f.formula.toLowerCase().includes(givenQuery);
                const matchFind = !findQuery || f.find.toLowerCase().includes(findQuery);
                const matchGiven = !givenQuery || f.given.some(g => g.toLowerCase().includes(givenQuery)) || nameMatch;
                return matchFind && matchGiven;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-500 text-xs">${loc.notFound}</div>`;
                return;
            }

            filtered.forEach(f => {
                const card = document.createElement('div');
                card.className = "bg-slate-900/60 border border-slate-800/80 hover:border-cyan-500/50 rounded-2xl p-3 transition flex items-center justify-between cursor-pointer group shadow-sm hover:shadow-cyan-500/10";
                card.onclick = () => openCalc(f);
                
                let badgeText = f.type === 'custom' ? loc.badgeCustom : loc.badgePhysics;
                let badgeColor = f.type === 'custom' ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' : 'bg-cyan-500/10 text-cyan-400 border-cyan-500/20';

                card.innerHTML = `
                    <div class="pr-2">
                        <div class="flex items-center space-x-1.5 mb-1">
                            <span class="text-[9px] ${badgeColor} border px-2 py-0.5 rounded-full font-semibold">${badgeText}</span>
                            <span class="text-[11px] text-slate-400">${loc.findLabelText} <strong class="text-white">${f.find}</strong></span>
                        </div>
                        <h3 class="font-bold text-xs sm:text-sm text-slate-200 group-hover:text-cyan-400 transition">${f.name}</h3>
                        <p class="text-[11px] text-slate-400 mt-0.5">${loc.givenLabelText} ${f.given.join(', ')}</p>
                    </div>
                    <div class="bg-slate-950 border border-slate-800 px-2.5 py-2 rounded-xl text-cyan-400 font-mono font-bold text-xs shrink-0">
                        ${f.formula}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openCalc(formula) {
            activeFormula = formula;
            document.getElementById('calcModal').classList.remove('hidden');
            document.getElementById('modalFormulaTitle').innerText = formula.name;
            document.getElementById('modalFormulaEquation').innerText = formula.formula;
            document.getElementById('modalResult').innerText = '';

            const inputsDiv = document.getElementById('modalInputs');
            inputsDiv.innerHTML = '';

            Object.keys(formula.symbols).forEach(sym => {
                inputsDiv.innerHTML += `
                    <div>
                        <label class="text-[11px] text-slate-400 block mb-1">${formula.symbols[sym]}:</label>
                        <input type="number" id="val_${sym}" placeholder="..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-cyan-500 text-white">
                    </div>
                `;
            });
            document.getElementById('calcBtnText').innerText = i18n[currentLang].calcBtn;
        }

        function closeCalc() { document.getElementById('calcModal').classList.add('hidden'); }

        function calculateResult() {
            if (!activeFormula) return;
            const data = {};
            let isValid = true;
            const loc = i18n[currentLang];

            Object.keys(activeFormula.symbols).forEach(sym => {
                const el = document.getElementById(`val_${sym}`);
                const val = el ? parseFloat(el.value) : NaN;
                if (isNaN(val)) isValid = false;
                data[sym] = val;
            });

            if (!isValid) {
                document.getElementById('modalResult').innerText = loc.fillAll;
                return;
            }

            try {
                const res = activeFormula.calc(data);
                document.getElementById('modalResult').innerText = `${loc.result} ${res.toFixed(4)}`;
            } catch (e) {
                document.getElementById('modalResult').innerText = loc.calcError;
            }
        }

        function openStandaloneCalc() { document.getElementById('standaloneCalcModal').classList.remove('hidden'); }
        function closeStandaloneCalc() { document.getElementById('standaloneCalcModal').classList.add('hidden'); }

        function calcAppend(char) {
            const screen = document.getElementById('calcScreen');
            screen.value += char;
        }
        function calcClear() {
            document.getElementById('calcScreen').value = '';
        }
        function calcEvaluate() {
            const screen = document.getElementById('calcScreen');
            try {
                screen.value = eval(screen.value);
            } catch (e) {
                screen.value = "Error";
            }
        }

        function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
        function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); }

        function saveCustomFormula() {
            const title = document.getElementById('newTitle').value.trim();
            const formulaStr = document.getElementById('newFormula').value.trim();
            const findStr = document.getElementById('newFind').value.trim();
            const givenStr = document.getElementById('newGiven').value.trim();
            const calcStr = document.getElementById('newCalc').value.trim();
            const loc = i18n[currentLang];

            if (!title || !formulaStr || !findStr || !calcStr) {
                alert(loc.fillAll);
                return;
            }

            const givenArr = givenStr ? givenStr.split(',').map(s => s.trim()) : [];
            const symbolsObj = {};
            givenArr.forEach(g => symbolsObj[g] = g);
            symbolsObj[findStr] = findStr;

            const newF = {
                id: Date.now(),
                type: 'custom',
                name: title,
                formula: formulaStr,
                given: givenArr,
                find: findStr,
                calcStr: calcStr,
                calc: new Function('d', 'return ' + calcStr),
                symbols: symbolsObj
            };

            customFormulas.push(newF);
            localStorage.setItem('custom_physics_formulas_data', JSON.stringify(customFormulas.map(f => ({
                id: f.id, type: f.type, name: f.name, formula: f.formula, given: f.given, find: f.find, calcStr: f.calcStr, symbols: f.symbols
            }))));

            closeAddModal();
            setTab('custom');
        }

        renderFormulas();
    </script>
</body>
</html>
